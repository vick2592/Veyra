openapi: 3.0.3
info:
  title: Veyra Autonomous Hardware Broker
  description: Hardware-secured AI execution layer utilizing deterministic Ledger BIP-32 leaves for isolated agent execution.
  version: 1.0.0
servers:
  - url: https://yoga-delouse-thread.ngrok-free.dev
paths:
  /api/secrets/encrypt:
    post:
      summary: Encrypt a secret scoped to a user's derived BIP-32 leaf
      description: |
        Encrypts a plaintext secret under a key scoped to the user's derived leaf index.
        The leaf index is deterministically computed from the user's Ethereum address via
        `keccak256(address) % 2^31`, producing a BIP-32 path of the form `m/44'/60'/0'/0/<leafIndex>`.
      operationId: encryptSecret
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptSecretRequest'
      responses:
        '200':
          description: Secret successfully encrypted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptSecretSuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Hardware encryption failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/bazantic/requests:
    post:
      summary: Queue a capability request for human World ID approval
      description: |
        The agent-facing entry point. Submits a request for a capability that a
        human must approve with World ID Face Auth before it executes. Returns
        202 with a requestId immediately; the work has NOT run yet. Poll
        getCapabilityRequest until status is completed or failed.

        The agent never receives the API key the work is performed with.
      operationId: createCapabilityRequest
      tags:
        - Capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCapabilityRequest'
      responses:
        '202':
          description: Queued and awaiting human authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityRequestStatus'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/bazantic/requests/{requestId}:
    get:
      summary: Poll a capability request until a human approves it
      description: |
        Returns the current state: pending_human_auth, executing, completed, or
        failed. `result` appears only on completed. Poll every few seconds — a
        human has to physically pass a Face Auth check, so this is not instant.
      operationId: getCapabilityRequest
      tags:
        - Capability
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityRequestStatus'
        '404':
          description: Not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/execute-agent:
    post:
      summary: Execute an agent action after World ID verification
      description: |
        Verifies the caller's World ID proof against the on-chain World ID Router,
        decrypts the user-specific secret from the provided ciphertext using the
        derived hardware key slot, and executes the agent provider call with the
        decrypted API key.
      operationId: executeAgent
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteAgentRequest'
      responses:
        '200':
          description: Agent action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteAgentSuccessResponse'
        '400':
          description: Validation error or World ID verification rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: World ID verification or agent execution failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    EncryptSecretRequest:
      type: object
      required:
        - userAddress
        - secretLabel
        - secretValue
      properties:
        userAddress:
          type: string
          description: A valid Ethereum address (EIP-55 or lowercase checksum).
          pattern: '^0x[0-9a-fA-F]{40}$'
          example: '0x8b0da63371eDaADd199C7654d9FaABb448Ab23BC'
        secretLabel:
          type: string
          description: Label identifying the secret. May only contain letters, numbers, dot, dash, and underscore.
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9_.-]+$'
          example: 'openai-key'
        secretValue:
          type: string
          description: The plaintext secret value to encrypt.
          minLength: 1
          example: 'sk-abc123'
    EncryptSecretSuccessResponse:
      type: object
      required:
        - success
        - bip32Path
        - ciphertextHex
      properties:
        success:
          type: boolean
          example: true
        bip32Path:
          type: string
          description: The derived BIP-32 path identifying the user's key leaf.
          pattern: "^m/44'/60'/0'/0/[0-9]+$"
          example: "m/44'/60'/0'/0/1234567890"
        ciphertextHex:
          type: string
          description: The encrypted ciphertext as a 0x-prefixed hex string.
          pattern: '^0x[0-9a-fA-F]+$'
          example: '0x1234567890abcdef'
    ExecuteAgentRequest:
      type: object
      required:
        - rp_id
        - secretIdentifier
        - idkitResponse
      properties:
        rp_id:
          type: string
          description: The World ID relying party identifier. Must begin with `rp_`.
          pattern: '^rp_'
          example: 'rp_veyra_local'
        secretIdentifier:
          type: string
          description: Identifier for the secret/action to execute.
          minLength: 1
          example: 'execute-agent'
        idkitResponse:
          description: The raw IDKit verification response payload (arbitrary JSON).
          type: object
          additionalProperties: true
    ExecuteAgentSuccessResponse:
      type: object
      required:
        - action
        - result
      properties:
        action:
          type: string
          description: The secret identifier that was executed.
          example: 'execute-agent'
        result:
          description: The raw response from the upstream agent provider.
          type: object
          additionalProperties: true
    CreateCapabilityRequest:
      type: object
      required:
        - secretIdentifier
        - agentAddress
        - idempotencyKey
      properties:
        secretIdentifier:
          type: string
          minLength: 1
          description: Allowlisted secret label. Never a raw secret value.
          example: 'openai-key'
        agentAddress:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: Wallet address authorized on-chain for this request.
        input:
          description: Optional provider input forwarded to the capability.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable key; retrying with the same key returns the original request.
        expiresAt:
          type: string
          format: date-time
    CapabilityRequestStatus:
      type: object
      required:
        - requestId
        - status
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        requestId:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
        status:
          type: string
          enum: [pending_human_auth, executing, completed, failed]
        agentAddress:
          type: string
        secretIdentifier:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        result:
          description: Present only when status is completed.
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: 'Secret encryption failed'